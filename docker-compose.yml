services: 
  postgres:
    image: postgres:18-alpine
    container_name: ewallet-db
    environment:
      POSTGRES_DB: ewallet_db
      POSTGRES_USER: ahmedesawy
      POSTGRES_PASSWORD: ahmedesawy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ahmedesawy -d ewallet_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: ewallet-cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
  
  app: 
    build: .
    container_name: ewallet-app 
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ewallet_db
      SPRING_DATASOURCE_USERNAME: ahmedesawy
      SPRING_DATASOURCE_PASSWORD: ahmedesawy
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes: 
  postgres_data: